[package]
name = "vzdalenost-20-20"
version = "0.1.0"
description = "20-20 Distance tray app"
license = "MIT"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
